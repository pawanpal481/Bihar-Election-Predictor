<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bihar Election Race Predictor</title>

    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">

<div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-xl">

    <h1 class="text-3xl font-bold text-center mb-6">
        Bihar Election Race Predictor
    </h1>

    <form action="/predict" method="POST" class="space-y-4">

        <div>
            <label class="block font-medium">Poll %</label>
            <input type="number" step="any" name="poll"
                   class="w-full p-2 border rounded" required>
        </div>

        <div>
            <label class="block font-medium">Total Votes</label>
            <input type="number" name="total_votes"
                   class="w-full p-2 border rounded" required>
        </div>

        <div>
            <label class="block font-medium">Total Electors</label>
            <input type="number" name="total_electors"
                   class="w-full p-2 border rounded" required>
        </div>

        <!-- Party -->
        <div>
            <label class="block font-medium">Party</label>

            <select name="party" class="w-full p-2 border rounded">

                {% for key, value in parties.items() %}
                <option value="{{ key }}">{{ value }}</option>
                {% endfor %}

            </select>
        </div>

        <!-- District -->
        <div>
            <label class="block font-medium">District</label>

            <select name="district" class="w-full p-2 border rounded">

                {% for key, value in districts.items() %}
                <option value="{{ key }}">{{ value }}</option>
                {% endfor %}

            </select>
        </div>

        <!-- Constituency Type -->
        <div>
            <label class="block font-medium">Constituency Type</label>

            <select name="type" class="w-full p-2 border rounded">

                {% for key, value in types.items() %}
                <option value="{{ key }}">{{ value }}</option>
                {% endfor %}

            </select>
        </div>

        <button type="submit"
                class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700">

            Predict
        </button>

    </form>

</div>

</body>
</html>
